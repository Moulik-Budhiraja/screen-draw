<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Utils</title>
<style>
/*FONTS*/
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  -webkit-user-select: none;
  user-select: none;
}
body.test {
  background: #f1f3f5 linear-gradient(135deg, #e9ecef 25%, transparent 25%, transparent 50%, #e9ecef 50%, #e9ecef 75%, transparent 75%) 0 0 / 40px 40px;
}
body.test.dark { background: #121212; }
canvas { position: fixed; inset: 0; display: block; touch-action: none; }
.text-editor {
  position: fixed;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  resize: none;
  overflow: hidden;
  background: transparent;
  word-break: normal;
  overflow-wrap: break-word;
  min-width: 1px;
  -webkit-user-select: text;
  user-select: text;
  caret-color: currentColor;
}

/* Note bar (⌥⇧S) */
#note {
  position: fixed;
  inset: 0;
  pointer-events: none;
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: #f5f5f7;
  -webkit-font-smoothing: antialiased;
  --note-bg: rgba(28, 28, 30, 0.94);
  --note-edge: rgba(255, 255, 255, 0.12);
  --note-muted: rgba(245, 245, 247, 0.45);
}
#note[hidden], #note [hidden] { display: none !important; }
.note-scrim { position: absolute; inset: 0; pointer-events: auto; }
.note-box {
  position: absolute;
  left: 50%;
  bottom: 56px;
  width: min(560px, calc(100vw - 32px));
  transform: translateX(-50%);
  pointer-events: auto;
}
.note-field {
  position: relative;
  height: 44px;
  overflow: hidden;
  border-radius: 12px;
  background: var(--note-bg);
  box-shadow: inset 0 0 0 0.5px var(--note-edge), 0 12px 40px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
}
.note-input, .note-mirror {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  margin: 0;
  padding: 0 16px;
  border: 0;
  font: inherit;
  line-height: 44px;
  letter-spacing: normal;
  white-space: pre;
}
.note-mirror { overflow: hidden; pointer-events: none; }
.note-mirror-text { display: inline-block; }
.note-input {
  width: 100%;
  background: transparent;
  color: transparent;
  caret-color: #f5f5f7;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
}
.note-input::placeholder { color: var(--note-muted); }
.note-input::selection { background: rgba(10, 132, 255, 0.45); }
.tok-folder, .tok-tag { border-radius: 4px; }
.tok-folder { color: #8cc2ff; background: rgba(10, 132, 255, 0.2); box-shadow: 0 0 0 1px rgba(10, 132, 255, 0.2); }
.tok-tag { color: #ffd479; background: rgba(255, 179, 0, 0.16); box-shadow: 0 0 0 1px rgba(255, 179, 0, 0.16); }
.note-suggest {
  position: absolute;
  bottom: calc(100% + 8px);
  min-width: 220px;
  max-width: 100%;
  box-sizing: border-box;
  padding: 4px;
  border-radius: 10px;
  background: var(--note-bg);
  box-shadow: inset 0 0 0 0.5px var(--note-edge), 0 12px 40px rgba(0, 0, 0, 0.35);
  font-size: 14px;
}
.note-row {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 30px;
  padding: 0 10px;
  border-radius: 6px;
  cursor: default;
}
.note-row.active { background: rgba(255, 255, 255, 0.1); }
.note-icon { display: flex; width: 14px; justify-content: center; color: var(--note-muted); }
.note-hash { font-weight: 600; }
.note-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-new { color: var(--note-muted); font-size: 12px; }
.note-toast {
  position: absolute;
  left: 50%;
  bottom: 56px;
  transform: translateX(-50%);
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--note-bg);
  box-shadow: inset 0 0 0 0.5px var(--note-edge), 0 8px 24px rgba(0, 0, 0, 0.3);
  font-size: 14px;
  animation: toast 1100ms ease forwards;
}
@keyframes toast {
  0% { opacity: 0; transform: translate(-50%, 6px); }
  12%, 75% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<script>
  // ?test gives the page a visible background when opened in a normal browser.
  const q = new URLSearchParams(location.search);
  if (q.has('test')) document.body.classList.add('test');
  if (q.get('test') === 'dark') document.body.classList.add('dark');
</script>
<!--SCRIPT-->
</body>
</html>
